<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bestia</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bestia" />
<meta name="theme-color" content="#0d0d0c" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" href="icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0d0d0c; --bg2:#141412; --card:#171715; --card2:#1d1d1a; --line:#292926;
  --text:#f4f1ea; --mute:#8e8c85; --dim:#5f5d57;
  --ember:#ff5a1f; --amber:#f2a516; --teal:#5fcfc0; --ok:#6fd08a; --bad:#ee5a4f;
  --disp:'Bebas Neue','Impact','Arial Narrow',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);touch-action:manipulation;-webkit-text-size-adjust:100%;overflow-x:hidden;max-width:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font-family:inherit}
.boot{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.boot b{font-family:var(--disp);font-size:56px;letter-spacing:.04em;color:var(--ember);font-weight:400;animation:breathe 1.6s ease-in-out infinite}
.boot p{color:var(--mute);max-width:320px;margin:0;font-size:14px}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(520px 360px at 50% -60px,rgba(255,90,31,.20),transparent 70%),
             radial-gradient(circle at 1px 1px,rgba(255,255,255,.028) 1px,transparent 0);
  background-size:auto,18px 18px}
.app{max-width:520px;margin:0 auto;position:relative;z-index:1;overflow-x:clip;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(112px + env(safe-area-inset-bottom,0px))}
.app.wk{padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))}
.rise>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.view{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.03em}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* top */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-family:var(--disp);font-size:40px;line-height:1;letter-spacing:.05em}
.brand i{font-style:normal;color:var(--ember)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill svg{color:var(--ember)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:700}
.card p{margin:0 0 8px;color:#cfccc4;font-size:14px;line-height:1.5}
.card p b{color:var(--text)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 20px;border:1px solid var(--line);
  background:#1a1512;
  background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 24%,#171715) 0%,#131311 62%);
  border-color:color-mix(in srgb,var(--dc) 38%,var(--line));transition:background .4s,border-color .4s}
.hero-day{font-family:var(--disp);font-size:68px;line-height:.9;margin:6px 0 2px;letter-spacing:.02em}
.hero-sub{color:var(--dc);font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.hero-list{list-style:none;padding:0;margin:16px 0 18px;display:grid;gap:7px;position:relative}
.hero-list li{display:flex;gap:10px;align-items:center;font-size:14px;color:#d9d6ce}
.hero-list li span.n{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--mute);flex:none}
.hero-list li em{font-style:normal;color:var(--mute);font-size:12px;margin-left:auto;white-space:nowrap}
.ember{position:absolute;bottom:-12px;width:6px;height:6px;border-radius:50%;background:var(--dc);opacity:0;filter:blur(1px);animation:floatUp 4.5s linear infinite;pointer-events:none}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;height:58px;border-radius:18px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:15px;transition:transform .15s,opacity .2s,box-shadow .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#ff7a2f,#ff4b14);color:#190a03;box-shadow:0 10px 30px rgba(255,90,31,.32)}
.btn-primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
.btn-primary.calm::after{display:none}
.btn-primary.nudge{animation:nudge 1.6s ease-in-out infinite}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn-danger{background:rgba(238,90,79,.12);border:1px solid rgba(238,90,79,.4);color:var(--bad)}
.btn.sq{width:58px;flex:none}
.btn[disabled]{opacity:.35;pointer-events:none}

.chips{display:flex;gap:8px;margin-top:12px}
.daychip{flex:1;padding:10px 8px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;transition:all .25s}
.daychip b{display:block;font-family:var(--disp);font-weight:400;font-size:24px;letter-spacing:.03em;line-height:1}
.daychip span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.daychip.on{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 12%,var(--card))}
.daychip.on b{color:var(--dc)}
.dots{display:flex;gap:10px;margin-top:4px}
.dot{width:100%;height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.dot.on{background:linear-gradient(90deg,#ff7a2f,#ffb02e);animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--amber),var(--ember));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.kv{display:flex;justify-content:space-between;align-items:baseline}
.kv b.disp{font-size:34px;line-height:1}

/* workout */
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.wtitle{flex:1;min-width:0}
.wtitle b{display:block;font-family:var(--disp);font-weight:400;font-size:24px;line-height:1;letter-spacing:.04em;color:var(--dc)}
.clock{font-weight:700;font-size:15px;color:var(--mute)}
.segs{display:flex;gap:5px;margin-bottom:18px}
.seg{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;transition:background .3s,transform .3s}
.seg.cur{background:#3a3a36;transform:scaleY(1.5)}
.seg i{display:block;height:100%;width:var(--p);background:var(--dc);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.step{animation:inRight .42s cubic-bezier(.2,.8,.2,1) both}
.step.back{animation-name:inLeft}
.step-title{font-family:var(--disp);font-weight:400;font-size:44px;line-height:.95;margin:6px 0 4px}
.step-sub{color:var(--mute);font-size:13px;line-height:1.4}
.restpill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap;transition:all .2s;flex:none}
.restpill svg{color:var(--ember)}
.restpill.on{border-color:var(--ember);background:rgba(255,90,31,.12);color:var(--ember)}
.block{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:14px}
.block-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.block-name{font-weight:800;font-size:18px}
.chip{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-weight:600}
.ab{width:24px;height:24px;border-radius:8px;background:var(--dc);color:#0d0d0c;font-weight:800;display:grid;place-items:center;font-size:12px;flex:none}
.tipbtn{margin-left:auto;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);color:var(--mute);display:grid;place-items:center}
.tip{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);font-size:13px;line-height:1.45;color:#cfccc4;animation:rise .3s both}
.sug{display:flex;gap:14px;align-items:center;margin:12px 0 4px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line);animation:rise .5s both}
.sug .big{font-family:var(--disp);font-size:52px;line-height:.85;letter-spacing:.02em;white-space:nowrap}
.sug .big small{font-size:20px;color:var(--mute);margin-left:3px}
.sug .tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.sug .line{font-size:12.5px;line-height:1.4;color:#cfccc4}
.sug .last{font-size:11.5px;color:var(--mute);margin-top:3px}
.sug.up{border-color:rgba(111,208,138,.5);background:rgba(111,208,138,.07)}.sug.up .tag{color:var(--ok)}
.sug.hold{border-color:rgba(242,165,22,.4);background:rgba(242,165,22,.06)}.sug.hold .tag{color:var(--amber)}
.sug.down{border-color:rgba(238,90,79,.45);background:rgba(238,90,79,.07)}.sug.down .tag{color:var(--bad)}
.sug.start{border-color:rgba(95,207,192,.4);background:rgba(95,207,192,.06)}.sug.start .tag{color:var(--teal)}
.setlbl,.setrow{display:grid;grid-template-columns:22px 1fr 1fr 54px;gap:8px;align-items:center}
.setlbl{margin-top:12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-align:center;font-weight:700}
.setlbl.t,.setrow.t{grid-template-columns:22px 1fr 54px}
.setrow{margin-top:8px;padding:5px;border-radius:16px;border:1px solid transparent;transition:border-color .25s,opacity .25s}
.setrow .si{font-weight:800;color:var(--dim);text-align:center;font-size:14px}
.setrow.active{border-color:var(--dc);animation:ring 1.9s ease-in-out infinite}
.setrow.done{opacity:.8}
.inp{height:54px;width:100%;min-width:0;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--text);text-align:center;font-weight:800;font-size:22px;transition:all .2s;-webkit-appearance:none;appearance:none}
.inp::placeholder{color:var(--dim);font-weight:600;font-size:15px}
.inp:focus{outline:none;border-color:var(--dc);box-shadow:0 0 0 3px color-mix(in srgb,var(--dc) 22%,transparent)}
.setrow.done .inp{background:rgba(111,208,138,.08);border-color:rgba(111,208,138,.35);color:var(--ok)}
.chk{height:54px;width:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg2);color:var(--mute);display:grid;place-items:center;transition:all .2s}
.chk:active{transform:scale(.9)}
.setrow.done .chk{background:var(--ok);border-color:var(--ok);color:#0d0d0c;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.setrow.shake{animation:shake .42s}

.cta{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:26px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.cta-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.restbar{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:#1c1b18;border:1px solid var(--ember);box-shadow:0 12px 34px rgba(0,0,0,.55);animation:slideUp .35s cubic-bezier(.2,.8,.2,1) both}
.restbar.fired{background:#15251a;border-color:var(--ok);animation:slideUp .35s both,flash .7s 3}
.restbar .t{font-family:var(--disp);font-size:38px;line-height:1;letter-spacing:.04em}
.restbar .l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700}
.mini{height:40px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.08);font-weight:800;font-size:13px;letter-spacing:.04em}
.ring{position:relative;flex:none}
.ring-in{position:absolute;inset:0;display:grid;place-items:center}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(13,13,12,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:color .2s}
.tab.on{color:var(--ember)}
.tab svg{transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.tab.on svg{transform:translateY(-2px) scale(1.12)}

/* progress / history */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.tile b{display:block;font-family:var(--disp);font-weight:400;font-size:34px;line-height:1}
.tile span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.status{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.status.up{color:var(--ok);background:rgba(111,208,138,.12)}
.status.flat{color:var(--amber);background:rgba(242,165,22,.12)}
.status.down{color:var(--bad);background:rgba(238,90,79,.12)}
.status.new{color:var(--mute);background:rgba(255,255,255,.06)}
.spark{width:100%;height:64px;display:block;margin-top:8px}
.spark path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .15s cubic-bezier(.2,.8,.2,1) forwards}
.spark circle{opacity:0;animation:fade .4s 1.1s forwards}
.hist-item{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0}
.hist-item span:last-child{color:var(--mute);text-align:right}
.badge{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:4px 9px;border-radius:99px}
.empty{text-align:center;padding:48px 16px;color:var(--mute);border:1px dashed var(--line);border-radius:22px;margin-top:12px;font-size:14px;line-height:1.5}
.empty b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;color:var(--text);letter-spacing:.04em;margin-bottom:4px}
.legend{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.legend:last-child{margin-bottom:0}
.legend .sw{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800}

/* summary */
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.sum-title{font-family:var(--disp);font-weight:400;font-size:64px;line-height:.9;margin:8px 0 6px;color:var(--ember);letter-spacing:.03em}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sum-grid .tile b{font-size:46px}

/* modal / toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both;padding:16px}
.sheet{width:100%;max-width:520px;background:var(--card2);border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:env(safe-area-inset-bottom,0px);animation:slideUp .32s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;gap:10px}
.sheet h4{margin:0 0 2px;font-family:var(--disp);font-weight:400;font-size:30px;letter-spacing:.04em}
.sheet p{margin:0 0 6px;color:var(--mute);font-size:14px;line-height:1.45}
.sheet textarea{width:100%;min-height:140px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--text);padding:12px;font-size:13px;resize:vertical}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:80;background:#222220;border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-weight:700;font-size:13px;animation:toast 2.6s both;white-space:nowrap}

/* keyframes */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes inRight{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inLeft{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--dc) 0%,transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--dc) 20%,transparent)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:.9}100%{transform:translateY(-230px) translateX(var(--dx,10px)) scale(.3);opacity:0}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flash{0%,100%{box-shadow:0 12px 34px rgba(0,0,0,.55)}50%{box-shadow:0 0 0 6px rgba(111,208,138,.3),0 12px 34px rgba(0,0,0,.55)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}12%,86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-14px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<script>
window.addEventListener('error', function (e) {
  var r = document.getElementById('root');
  if (!r || window.__mounted) return;
  r.innerHTML = '';
  var d = document.createElement('div'); d.className = 'boot';
  var b = document.createElement('b'); b.textContent = 'BESTIA';
  var p = document.createElement('p'); p.textContent = 'Błąd ładowania: ' + (e.message || 'nie udało się wczytać skryptu') + '. Odśwież stronę (Ctrl+Shift+R).';
  d.appendChild(b); d.appendChild(p); r.appendChild(d);
}, true);
setTimeout(function () {
  var r = document.getElementById('root');
  if (!window.__mounted && r) {
    r.innerHTML = '<div class="boot"><b>BESTIA</b><p>Nie udało się załadować aplikacji. Sprawdź internet i odśwież stronę.</p></div>';
  }
}, 12000);
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.15/babel.min.js"></script>
</head>
<body>
<div id="root"><div class="boot"><b>BESTIA</b><p>Ładowanie...</p></div></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ============ PLAN ============ */
const PLAN = {

const NAME = {};
Object.values(PLAN).forEach(d => d.steps.forEach(s => s.items.forEach(i => { NAME[i.id] = NAME[i.id] || i.name; })));

/* ============ HELPERS ============ */
const nf = n => (n == null || isNaN(n)) ? "" : (Math.round(n * 100) / 100).toString().replace(".", ",");
const num = v => parseFloat(String(v).replace(",", "."));
const e1rm = (w, r) => w * (1 + r / 30);
const fmtClock = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const fmtDate = d => new Date(d).toLocaleDateString("pl-PL", { weekday: "short", day: "numeric", month: "short" });
const parseRange = str => { const m = String(str).match(/(\d+)\D*(\d+)?/); const a = +m[1]; return { min: a, max: m[2] ? +m[2] : a }; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const weekStart = () => { const x = new Date(); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };

const LOGS_KEY = "bestia-workout-logs", DRAFT_KEY = "bestia-draft";
function loadLogs() { try { const r = localStorage.getItem(LOGS_KEY); const v = r ? JSON.parse(r) : []; return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function saveLogs(l) { try { localStorage.setItem(LOGS_KEY, JSON.stringify(l)); return true; } catch (e) { return false; } }

/* historia jednego ćwiczenia w danym dniu planu: tablica sesji (chronologicznie), każda to lista serii */
function sessionsForDayEx(logs, day, exId) {
  return [...logs].filter(l => l.day === day).sort((a, b) => new Date(a.date) - new Date(b.date))
    .map(l => { const e = (l.entries || []).find(x => x.exerciseId === exId); return e ? e.sets.filter(s => s.reps > 0) : null; })
    .filter(s => s && s.length);
}

/* PROGRESJA: podwójna progresja. Dobij górę zakresu na wszystkich seriach, wtedy dokładasz ciężar. */
function suggest(hist, range) {
  if (!hist.length) return { kind: "start", weight: null, tag: "Pierwszy raz", line: "Dobierz ciężar, przy którym zrobisz " + range.min + "-" + range.max + " powt. i zostaną Ci 2 w zapasie. Zapiszę go i od następnego razu sam policzę." };
  const last = hist[hist.length - 1];
  const w = Math.max(...last.map(s => s.weight));
  const top = last.filter(s => s.weight === w);
  const minR = Math.min(...top.map(s => s.reps));
  const lastTxt = "Ostatnio: " + nf(w) + " kg × " + top.map(s => s.reps).join(" · ");
  const hitTop = top.length >= 2 && top.every(s => s.reps >= range.max);
  if (hitTop) return { kind: "up", weight: w + INC, tag: "Dołóż ciężar", delta: "+" + nf(INC) + " kg", line: "Zrobiłeś " + range.max + "+ na każdej serii. Czas dołożyć.", last: lastTxt };
  if (top.some(s => s.reps < range.min)) {
    const prev = hist.length > 1 ? hist[hist.length - 2] : null;
    let prevMissed = false;
    if (prev) { const pw = Math.max(...prev.map(s => s.weight)); prevMissed = pw >= w && prev.filter(s => s.weight === pw).some(s => s.reps < range.min); }
    if (prevMissed) { let nw = Math.round(w * 0.9 / INC) * INC; if (nw >= w) nw = w - INC; nw = Math.max(INC, nw);
      return { kind: "down", weight: nw, tag: "Zejdź lżej", delta: "-" + nf(w - nw) + " kg", line: "Dwa razy z rzędu poniżej " + range.min + " powt. Zejdź o ok. 10% i wróć silniejszy.", last: lastTxt }; }
    return { kind: "hold", weight: w, tag: "Zostań", line: "Poniżej " + range.min + " powt. Zostań na tym ciężarze i dobij do " + range.min + "+ na każdej serii.", last: lastTxt };
  }
  return { kind: "hold", weight: w, tag: "Zostań", line: "Zostań na tym ciężarze. Cel: " + Math.min(range.max, minR + 1) + "+ powt. na każdej serii.", last: lastTxt };
}

function buildDraft(day, logs) {
  const data = {};
  PLAN[day].steps.forEach(st => st.items.forEach(it => {
    const sg = it.type === "time" ? null : suggest(sessionsForDayEx(logs, day, it.id), parseRange(it.reps));
    data[it.id] = Array.from({ length: it.sets }, () => ({ w: sg && sg.weight != null ? nf(sg.weight) : "", r: "", done: false }));
  }));
  return { day, startedAt: Date.now(), step: 0, data };
}

function exerciseStats(logs) {
  const map = {};
  [...logs].sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(l => (l.entries || []).forEach(e => {
    const sets = e.sets.filter(s => s.weight > 0 && s.reps > 0);
    if (!sets.length) return;
    const best = sets.reduce((a, s) => (e1rm(s.weight, s.reps) > e1rm(a.weight, a.reps) ? s : a), sets[0]);
    (map[e.exerciseId] = map[e.exerciseId] || { id: e.exerciseId, name: NAME[e.exerciseId] || e.name, pts: [] }).pts.push({ t: l.date, e1: e1rm(best.weight, best.reps), w: best.weight, r: best.reps });
  }));
  return Object.values(map).map(x => {
    const p = x.pts; let status = "new";
    if (p.length >= 2) {
      const ref = p.length >= 3 ? p[p.length - 3].e1 : p[p.length - 2].e1, cur = p[p.length - 1].e1;
      status = cur > ref * 1.015 ? "up" : cur < ref * 0.96 ? "down" : "flat";
    }
    return { ...x, status, last: p[p.length - 1], pr: Math.max(...p.map(q => q.e1)) };
  }).sort((a, b) => new Date(b.last.t) - new Date(a.last.t));
}

/* ============ AUDIO / TIMER ============ */
let actx = null;
function unlockAudio() { try { if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } if (actx && actx.state === "suspended") actx.resume(); } catch (e) {} }
function alarm() {
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 400]); } catch (e) {}
  try {
    unlockAudio(); if (!actx) return; const t = actx.currentTime;
    [0, 0.26, 0.52].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = i === 2 ? 1175 : 880;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(0.28, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.22);
      o.start(t + d); o.stop(t + d + 0.25);
    });
  } catch (e) {}
}
function useRest() {
  const [r, setR] = useState(null);
  const [now, setNow] = useState(Date.now());
  useEffect(() => { if (!r) return; const id = setInterval(() => setNow(Date.now()), 250); return () => clearInterval(id); }, [!!r]);
  useEffect(() => { if (r && !r.fired && now >= r.endAt) { alarm(); setR(x => x && { ...x, fired: true }); } }, [now, r]);
  useEffect(() => { if (r && r.fired) { const id = setTimeout(() => setR(null), 7000); return () => clearTimeout(id); } }, [r && r.fired]);
  const left = r ? Math.max(0, Math.ceil((r.endAt - now) / 1000)) : 0;
  const frac = r ? Math.max(0, Math.min(1, (r.endAt - now) / (r.total * 1000))) : 0;
  return {
    active: !!r, fired: !!(r && r.fired), left, frac,
    start: (sec) => { unlockAudio(); const t = Date.now(); setNow(t); setR({ endAt: t + sec * 1000, total: sec, fired: false }); },
    add: (s) => setR(x => x && !x.fired ? { ...x, endAt: x.endAt + s * 1000, total: x.total + s } : x),
    stop: () => setR(null),
  };
}
function useWakeLock(on) {
  useEffect(() => {
    if (!on || !("wakeLock" in navigator)) return;
    let lock = null, dead = false;
    const get = async () => { try { lock = await navigator.wakeLock.request("screen"); } catch (e) {} };
    get();
    const vis = () => { if (document.visibilityState === "visible" && !dead) get(); };
    document.addEventListener("visibilitychange", vis);
    return () => { dead = true; document.removeEventListener("visibilitychange", vis); try { lock && lock.release(); } catch (e) {} };
  }, [on]);
}
function useCountUp(to, ms = 1000) {
  const [v, setV] = useState(0);
  useEffect(() => { let raf, t0; const f = t => { if (!t0) t0 = t; const p = Math.min(1, (t - t0) / ms); setV(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(f); }; raf = requestAnimationFrame(f); return () => cancelAnimationFrame(raf); }, [to]);
  return v;
}

function Elapsed({ since }) {

function Confetti() {
  const ref = useRef(null);
  useEffect(() => {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = ref.current; if (!c) return; const ctx = c.getContext && c.getContext("2d"); if (!ctx) return;
    const dpr = window.devicePixelRatio || 1, W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
    const cols = ["#ff5a1f", "#f2a516", "#5fcfc0", "#f4f1ea", "#ff8a4c"];
    const ps = Array.from({ length: 120 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .36, vx: (Math.random() - .5) * 15 * dpr, vy: (-Math.random() * 17 - 4) * dpr, s: (5 + Math.random() * 7) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)], life: 1 }));
    let raf, t0 = performance.now();
    const loop = t => {
      const dt = Math.min(32, t - t0) / 16; t0 = t; ctx.clearRect(0, 0, W, H); let alive = false;
      ps.forEach(p => { p.vy += .36 * dpr * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .99; p.r += p.vr * dt; p.life -= .006 * dt;
        if (p.life > 0 && p.y < H + 40) { alive = true; ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); } });
      if (alive) raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop); return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} className="confetti" />;
}

}

const streakOf = logs => {
  if (!logs.length) return 0; const s = [...logs].sort((a, b) => new Date(b.date) - new Date(a.date)); let c = 1;
  for (let i = 0; i < s.length - 1; i++) { if ((new Date(s[i].date) - new Date(s[i + 1].date)) / 864e5 <= 4) c++; else break; }
  return c;
};

      <div className="chips" style={{ "--i": 2 }}>{[1, 2, 3].map(d => <button key={d} className={"daychip" + (d === day ? " on" : "")} style={{ "--dc": PLAN[d].color }} onClick={() => setDay(d)}><b>DZIEŃ {d}</b><span>{PLAN[d].sub}</span></button>)}</div>
      <div className="card" style={{ "--i": 3 }}><h3>Ten tydzień</h3><div className="dots">{[0, 1, 2].map(i => <div key={i} className={"dot" + (i < week ? " on" : "")} style={{ animationDelay: i * 120 + "ms" }} />)}</div>
        <p style={{ margin: "10px 0 0", color: "var(--mute)" }}>{week >= 3 ? "Komplet. Teraz regeneracja." : week + " z 3 treningów zrobione"}</p></div>
      <div className="card" style={{ "--i": 4 }}><div className="kv"><h3 style={{ margin: 0 }}>Poziom bestii</h3><b className="disp num">{lvl}</b></div><div className="bar"><i style={{ width: Math.max(lvl, 3) + "%" }} /></div>
        <p style={{ margin: "10px 0 0", color: "var(--mute)" }}>{rankName(lvl)} · {logs.length} {logs.length === 1 ? "trening" : "treningów"} w dzienniku</p></div>
    </div>
  </div>;
}

/* ============ WORKOUT ============ */
function Workout({ draft, setDraft, logs, rest, onFinish, onAbort }) {
  const plan = PLAN[draft.day], total = plan.steps.length, step = plan.steps[draft.step];
  const [dir, setDir] = useState(1), [modal, setModal] = useState(null), [shake, setShake] = useState(null), [tips, setTips] = useState({});
  useWakeLock(true);
  const sugg = useMemo(() => { const o = {}; plan.steps.forEach(st => st.items.forEach(it => { o[it.id] = it.type === "time" ? null : suggest(sessionsForDayEx(logs, draft.day, it.id), parseRange(it.reps)); })); return o; }, [logs, draft.day]);

  const patch = (d, id, i, p) => ({ ...d, data: { ...d.data, [id]: d.data[id].map((r, j) => j === i ? { ...r, ...p } : r) } });
  const onWeight = (id, i, val) => setDraft(d => { const rows = d.data[id], old = rows[i].w; return { ...d, data: { ...d.data, [id]: rows.map((r, j) => j === i ? { ...r, w: val } : (j > i && !r.done && r.w === old ? { ...r, w: val } : r)) } }; });
  const onReps = (id, i, val) => setDraft(d => patch(d, id, i, { r: val }));

  function toggle(item, i) {
    const row = draft.data[item.id][i];
    if (row.done) { setDraft(d => patch(d, item.id, i, { done: false })); return; }
    const w = item.type === "time" ? 0 : num(row.w), r = parseInt(row.r, 10);
    if (!(r >= 1) || (item.type !== "time" && !(w > 0))) { setShake(item.id + ":" + i); setTimeout(() => setShake(null), 450); return; }
    unlockAudio(); try { navigator.vibrate && navigator.vibrate(18); } catch (e) {}
    const nd = patch(draft, item.id, i, { done: true }); setDraft(nd);
    const all = step.items.every(it => nd.data[it.id].every(x => x.done));
    const round = step.items.every(it => !nd.data[it.id][i] || nd.data[it.id][i].done);
    if (round && !all) rest.start(step.rest);
  }
  const active = (() => { const mx = Math.max(...step.items.map(it => it.sets)); for (let i = 0; i < mx; i++) for (const it of step.items) { const row = draft.data[it.id][i]; if (row && !row.done) return it.id + ":" + i; } return null; })();
  const stepDone = step.items.every(it => draft.data[it.id].every(x => x.done));
  const frac = st => { let d = 0, n = 0; st.items.forEach(it => draft.data[it.id].forEach(x => { n++; if (x.done) d++; })); return n ? d / n : 0; };

  function go(n) { if (n < 0 || n >= total) return; setDir(n > draft.step ? 1 : -1); setDraft(d => ({ ...d, step: n })); window.scrollTo({ top: 0, behavior: "smooth" }); }
  function finish() {
    const entries = [];
    plan.steps.forEach(st => st.items.forEach(it => { const sets = draft.data[it.id].filter(r => r.done).map(r => ({ weight: it.type === "time" ? 0 : num(r.w), reps: parseInt(r.r, 10) })); if (sets.length) entries.push({ exerciseId: it.id, name: it.name, sets }); }));
    if (!entries.length) { setModal("empty"); return; }
    onFinish(entries);
  }
  const last = draft.step === total - 1;
  const isSuper = step.items.length > 1;

  return <div className="app wk" style={{ "--dc": plan.color }}>
    <div className="wtop">
      <button className="iconbtn" onClick={() => setModal("exit")} aria-label="Wyjdź"><Icon n="close" /></button>
      <div className="wtitle"><div className="eyebrow">Dzień {draft.day}</div><b>{plan.name}</b></div>
      <Elapsed since={draft.startedAt} />
    </div>
    <div className="segs">{plan.steps.map((s, i) => <div key={i} className={"seg" + (i === draft.step ? " cur" : "")} style={{ "--p": Math.round(frac(s) * 100) + "%" }}><i /></div>)}</div>

    <div key={draft.step} className={"step" + (dir < 0 ? " back" : "")}>
      <div className="row" style={{ alignItems: "flex-start" }}>
        <div className="sp">
          <div className="eyebrow">{isSuper ? "Superseria · " : ""}Ćwiczenie {draft.step + 1} z {total}</div>
          <div className="step-title">{isSuper ? "SUPERSERIA" : step.items[0].name.toUpperCase()}</div>
          {isSuper && <div className="step-sub">Rób na zmianę A, potem B. Odpoczynek dopiero po parze.</div>}
        </div>
        <button className={"restpill" + (rest.active ? " on" : "")} onClick={() => rest.active ? rest.stop() : rest.start(step.rest)} aria-label="Odpoczynek">
          <Icon n="timer" size={18} />{rest.active && !rest.fired ? <span className="num">{fmtClock(rest.left)}</span> : rest.fired ? "Gotowe" : <span className="num">{step.rest} s</span>}
        </button>
      </div>

      {step.items.map((it, k) => {
        const sg = sugg[it.id], rows = draft.data[it.id], isTime = it.type === "time";
        return <div className="block" key={it.id}>
          <div className="block-head">
            {isSuper && <span className="ab">{"AB"[k]}</span>}
            <span className="block-name">{it.name}</span>
            <span className="chip">{it.muscle}</span>
            <button className="tipbtn" onClick={() => setTips(t => ({ ...t, [it.id]: !t[it.id] }))} aria-label="Technika"><Icon n="bulb" size={17} /></button>
          </div>
          {tips[it.id] && <div className="tip">{it.tip}</div>}
          {sg ? <div className={"sug " + sg.kind}>
            {sg.weight != null && <div className="big num">{nf(sg.weight)}<small>kg</small></div>}
            <div><div className="tag">{sg.kind === "up" ? "↑ " : sg.kind === "down" ? "↓ " : sg.kind === "hold" ? "→ " : "★ "}{sg.tag}{sg.delta ? " " + sg.delta : ""}</div>
              <div className="line">{sg.line}</div>{sg.last && <div className="last">{sg.last}</div>}</div>
          </div> : <div className="sug start"><div><div className="tag">Cel: {it.reps} sekund</div><div className="line">Gdy robi się łatwo, dodaj 5 sekund.</div></div></div>}
          <div className={"setlbl" + (isTime ? " t" : "")}><span /> {!isTime && <span>kg</span>}<span>{isTime ? "sekundy" : "powt. (cel " + it.reps + ")"}</span><span /></div>
          {rows.map((r, i) => {
            const key = it.id + ":" + i;
            return <div key={i} className={"setrow" + (isTime ? " t" : "") + (r.done ? " done" : "") + (active === key ? " active" : "") + (shake === key ? " shake" : "")}>
              <span className="si">{i + 1}</span>
              {!isTime && <input className="inp num" inputMode="decimal" placeholder="kg" value={r.w} onChange={e => onWeight(it.id, i, e.target.value.replace(/[^0-9.,]/g, ""))} />}
              <input className="inp num" inputMode="numeric" placeholder={isTime ? "s" : it.reps.split("-")[0] + "+"} value={r.r} onChange={e => onReps(it.id, i, e.target.value.replace(/[^0-9]/g, ""))} />
              <button className="chk" onClick={() => toggle(it, i)} aria-label={r.done ? "Cofnij serię" : "Zalicz serię"}><Icon n="check" size={26} /></button>
            </div>;
          })}
        </div>;
      })}
    </div>

    <div className="cta"><div className="cta-in">
      {rest.active && <div className={"restbar" + (rest.fired ? " fired" : "")} onClick={rest.fired ? rest.stop : undefined}>
        <Ring size={52} stroke={5} frac={rest.fired ? 1 : rest.frac} color={rest.fired ? "#6fd08a" : "#ff5a1f"}><Icon n="timer" size={20} /></Ring>
        <div className="sp"><div className="l">{rest.fired ? "Koniec przerwy" : "Odpoczynek"}</div><div className="t num">{rest.fired ? "DO BOJU!" : fmtClock(rest.left)}</div></div>
        {!rest.fired && <><button className="mini" onClick={rest.add.bind(null, 15)}>+15 s</button><button className="mini" onClick={rest.stop}>Pomiń</button></>}
      </div>}
      <div className="row">
        <button className="btn btn-ghost sq" disabled={draft.step === 0} onClick={() => go(draft.step - 1)} aria-label="Poprzednie ćwiczenie"><Icon n="left" /></button>
        {last ? <button className={"btn btn-primary" + (stepDone ? " nudge" : " calm")} onClick={finish}>Zakończ trening</button>
          : <button className={"btn btn-primary" + (stepDone ? " nudge" : " calm")} onClick={() => go(draft.step + 1)}>{stepDone ? "Dalej" : "Pomiń / dalej"}<Icon n="right" size={20} /></button>}
      </div>
    </div></div>

    {modal === "exit" && <Modal onClose={() => setModal(null)}><h4>Przerwać trening?</h4><p>Zapisane serie możesz zachować albo wszystko porzucić.</p>
      <button className="btn btn-primary calm" onClick={() => { setModal(null); finish(); }}>Zakończ i zapisz</button>
      <button className="btn btn-ghost" onClick={() => setModal(null)}>Wróć do treningu</button>
      <button className="btn btn-danger" onClick={onAbort}>Porzuć trening</button></Modal>}
    {modal === "empty" && <Modal onClose={() => setModal(null)}><h4>Brak zaliczonych serii</h4><p>Zaznacz ptaszkiem choć jedną serię, żeby trening się zapisał. Albo go porzuć.</p>
      <button className="btn btn-ghost" onClick={() => setModal(null)}>Wróć</button><button className="btn btn-danger" onClick={onAbort}>Porzuć trening</button></Modal>}
  </div>;
}

/* ============ SUMMARY ============ */
function Summary({ data, onDone }) {
  const sets = useCountUp(data.sets, 900), vol = useCountUp(data.volume, 1300), min = useCountUp(Math.max(1, Math.round(data.durationMs / 60000)), 900);
  return <div className="app view" style={{ "--dc": PLAN[data.day].color }}>
    <Confetti />
    <div className="eyebrow">Dzień {data.day} · {PLAN[data.day].name}</div>
    <div className="sum-title">TRENING<br />ZALICZONY</div>
    <div className="sum-grid rise">
      <div className="tile" style={{ "--i": 1 }}><b className="num">{sets}</b><span>serii</span></div>
      <div className="tile" style={{ "--i": 2 }}><b className="num">{min}</b><span>minut</span></div>
      <div className="tile" style={{ "--i": 3, gridColumn: "1 / -1" }}><b className="num">{vol.toLocaleString("pl-PL")}</b><span>kg objętości (ciężar × powtórzenia)</span></div>
    </div>
    {data.prs.length > 0 && <div className="card"><h3>Nowe rekordy</h3>{data.prs.map((p, i) => <div className="hist-item" key={i}><span>🏆 {p.name}</span><span>{nf(p.w)} kg × {p.r}</span></div>)}</div>}
    <div className="card"><h3>Co dalej</h3><p>Następnym razem apka sama podpowie ciężar dla każdego ćwiczenia na podstawie tego treningu. Dobrze zjedz, prześpij się i do zobaczenia.</p></div>
    <div style={{ marginTop: 16 }}><button className="btn btn-primary calm" onClick={onDone}>Gotowe</button></div>
  </div>;
}

/* ============ PROGRESS ============ */
function Spark({ pts, color }) {
  if (pts.length < 2) return null;
  const W = 300, H = 64, P = 8, v = pts.map(p => p.e1), mn = Math.min(...v), mx = Math.max(...v), rg = mx - mn || 1;
  const xy = pts.map((p, i) => [P + i / (pts.length - 1) * (W - 2 * P), H - P - (p.e1 - mn) / rg * (H - 2 * P)]);
  return <svg className="spark" viewBox={"0 0 " + W + " " + H} preserveAspectRatio="none">
    <path d={"M" + xy.map(p => p.join(",")).join(" L")} pathLength="1" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
    {xy.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color} />)}</svg>;
}
function Progress({ logs }) {
  const stats = useMemo(() => exerciseStats(logs), [logs]);
  if (!logs.length) return <div className="app view"><div className="topbar"><div className="brand">POSTĘPY</div></div><div className="empty"><b>JESZCZE PUSTO</b>Zrób pierwszy trening, a tu pojawią się wykresy i wnioski.</div></div>;
  const vol = logs.reduce((a, l) => a + (l.entries || []).reduce((b, e) => b + e.sets.reduce((c, s) => c + s.weight * s.reps, 0), 0), 0);
  const C = { up: "#6fd08a", flat: "#f2a516", down: "#ee5a4f", new: "#8e8c85" }, L = { up: "Progres", flat: "Plateau", down: "Regres", new: "Nowe" };
  const flat = stats.filter(s => s.status === "flat"), down = stats.filter(s => s.status === "down"), up = stats.filter(s => s.status === "up");
  return <div className="app view"><div className="topbar"><div className="brand">POSTĘPY</div></div>
    <div className="tiles rise"><div className="tile" style={{ "--i": 0 }}><b className="num">{logs.length}</b><span>treningi</span></div><div className="tile" style={{ "--i": 1 }}><b className="num">{Math.round(vol / 1000 * 10) / 10}</b><span>ton łącznie</span></div><div className="tile" style={{ "--i": 2 }}><b className="num">{up.length}</b><span>rośnie</span></div></div>
    <div className="card"><h3>Wnioski trenera</h3>
      {up.length > 0 && <p><b>Rośnie:</b> {up.map(s => s.name).join(", ")}. Tak trzymać.</p>}
      {flat.length > 0 && <p><b>Stoi w miejscu:</b> {flat.map(s => s.name).join(", ")}. Dobij górę zakresu powtórzeń na każdej serii, zanim dołożysz ciężar. Jeśli stoi 3+ tygodnie, zmień wariant (np. inny kąt lub chwyt).</p>}
      {down.length > 0 && <p><b>Spada:</b> {down.map(s => s.name).join(", ")}. Sprawdź sen, jedzenie i zmęczenie po pracy. Jedna słabsza sesja to nie problem, trzy z rzędu to sygnał do lżejszego tygodnia.</p>}
      {stats.every(s => s.status === "new") && <p>Po drugim treningu tego samego dnia zacznę oceniać trendy.</p>}</div>
    {stats.map((s, i) => <div className="card" key={s.id} style={{ animation: "rise .5s both", animationDelay: i * 50 + "ms" }}>
      <div className="kv"><b style={{ fontSize: 16 }}>{s.name}</b><span className={"status " + s.status}>{L[s.status]}</span></div>
      <Spark pts={s.pts} color={C[s.status]} />
      <div className="kv" style={{ marginTop: 8, fontSize: 13, color: "var(--mute)" }}><span>Ostatnio: {nf(s.last.w)} kg × {s.last.r}</span><span>Rekord e1RM: {nf(Math.round(s.pr * 10) / 10)} kg</span></div></div>)}
    <p style={{ color: "var(--dim)", fontSize: 12, marginTop: 14 }}>e1RM to szacowany maksymalny ciężar na 1 powtórzenie. Pozwala porównywać serie o różnej liczbie powtórzeń.</p>
  </div>;
}

/* ============ HISTORY ============ */
function History({ logs, onDelete }) {

    {!sorted.length ? <div className="empty"><b>BRAK TRENINGÓW</b>Każdy zakończony trening pojawi się tutaj.</div> :
      sorted.map((s, idx) => { const p = PLAN[s.day] || PLAN[1], vol = (s.entries || []).reduce((a, e) => a + e.sets.reduce((b, x) => b + x.weight * x.reps, 0), 0), n = (s.entries || []).reduce((a, e) => a + e.sets.length, 0);
        return <div className="card" key={s.id} style={{ animation: "rise .5s both", animationDelay: Math.min(idx, 8) * 50 + "ms" }}>
          <div className="kv"><span className="badge" style={{ background: p.color + "26", color: p.color }}>Dzień {s.day} · {p.name}</span>
            {ask === s.id ? <button className="mini" style={{ color: "var(--bad)" }} onClick={() => { onDelete(s.id); setAsk(null); }}>Na pewno usuń</button> : <button onClick={() => setAsk(s.id)} aria-label="Usuń" style={{ color: "var(--dim)" }}><Icon n="trash" size={18} /></button>}</div>
          <div style={{ margin: "8px 0 10px", fontSize: 13, color: "var(--mute)" }}>{fmtDate(s.date)} · {n} serii · {Math.round(vol).toLocaleString("pl-PL")} kg{s.durationMs ? " · " + Math.round(s.durationMs / 60000) + " min" : ""}</div>
          {(s.entries || []).map(e => <div className="hist-item" key={e.exerciseId}><span>{e.name}</span><span className="num">{e.sets.map(x => x.weight ? nf(x.weight) + "×" + x.reps : x.reps + " s").join(", ")}</span></div>)}</div>; })}
  </div>;
}

/* ============ INFO ============ */

/* ============ APP ============ */
function TabBar({ tab, setTab }) {
  const T = [["home", "Trening", "train"], ["progress", "Postępy", "chart"], ["history", "Historia", "history"], ["info", "Info", "info"]];
  return <div className="tabbar"><div className="tabbar-in">{T.map(t => <button key={t[0]} className={"tab" + (tab === t[0] ? " on" : "")} onClick={() => { setTab(t[0]); window.scrollTo({ top: 0 }); }}><Icon n={t[2]} />{t[1]}</button>)}</div></div>;
}

function App() {
  const [logs, setLogs] = useState(loadLogs);
  const [draft, setDraft] = useState(loadDraft);
  const [tab, setTab] = useState("home");
  const [summary, setSummary] = useState(null);
  const [toastMsg, setToastMsg] = useState("");
  const rest = useRest();
  useEffect(() => { window.__mounted = true; }, []);
  useEffect(() => { saveDraft(draft); }, [draft]);
  const toast = useCallback(m => { setToastMsg(""); setTimeout(() => setToastMsg(m), 10); setTimeout(() => setToastMsg(""), 2700); }, []);
  const persist = next => { if (!saveLogs(next)) toast("Nie udało się zapisać danych"); setLogs(next); };

  function start(day) { unlockAudio(); rest.stop(); setDraft(buildDraft(day, logs)); window.scrollTo({ top: 0 }); }
  function abort() { rest.stop(); setDraft(null); }
  function finish(entries) {
    const prev = {}; exerciseStats(logs).forEach(s => { prev[s.id] = s.pr; });
    const prs = [];
    entries.forEach(e => { const sets = e.sets.filter(s => s.weight > 0); if (!sets.length || prev[e.exerciseId] == null) return;
      const b = sets.reduce((a, s) => e1rm(s.weight, s.reps) > e1rm(a.weight, a.reps) ? s : a, sets[0]);
      if (e1rm(b.weight, b.reps) > prev[e.exerciseId] * 1.005) prs.push({ name: e.name, w: b.weight, r: b.reps }); });
    const durationMs = Date.now() - draft.startedAt;
    const session = { id: uid(), date: new Date().toISOString(), day: draft.day, durationMs, entries };
    persist([...logs, session]);
    setSummary({ day: draft.day, sets: entries.reduce((a, e) => a + e.sets.length, 0), volume: Math.round(entries.reduce((a, e) => a + e.sets.reduce((b, s) => b + s.weight * s.reps, 0), 0)), durationMs, prs });
    rest.stop(); setDraft(null);
  }
  const importLogs = v => { const ids = new Set(logs.map(l => l.id)); persist([...logs, ...v.filter(x => !ids.has(x.id))]); toast("Wczytano kopię"); };

  return <ErrorBoundary><div className="glow" />
    {summary ? <Summary data={summary} onDone={() => { setSummary(null); setTab("home"); window.scrollTo({ top: 0 }); }} />
      : draft ? <Workout draft={draft} setDraft={setDraft} logs={logs} rest={rest} onFinish={finish} onAbort={abort} />
      : <>
        {tab === "home" && <Home logs={logs} draft={draft} onStart={start} onResume={() => {}} onDiscard={abort} />}
        {tab === "progress" && <Progress logs={logs} />}
        {tab === "history" && <History logs={logs} onDelete={id => persist(logs.filter(l => l.id !== id))} />}
        {tab === "info" && <Info logs={logs} onImport={importLogs} toast={toast} />}
        <TabBar tab={tab} setTab={setTab} />
      </>}
    {toastMsg && <div className="toast">{toastMsg}</div>}
  </ErrorBoundary>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
